# Disposable compatibility-test database. No development data volumes are used.
services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_DB: writerelay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: integration-test-password
      # Explicit PGDATA works across the PostgreSQL 18 image layout change.
      PGDATA: /var/lib/postgresql/test-data
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d writerelay"]
      interval: 2s
      timeout: 3s
      retries: 30
