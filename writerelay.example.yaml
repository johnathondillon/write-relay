version: 1

postgres:
  dsn_env: WRITERELAY_POSTGRES_DSN
  slot: writerelay_slot_v1
  publication: writerelay_publication
  message_prefix: writerelay.v1
  status_interval: 10s
  create_slot_if_missing: false
  max_transaction_events: 10000
  max_transaction_bytes: 8388608

spool:
  path: ./data/writerelay.sqlite
  max_event_bytes: 262144

delivery:
  poll_interval: 1s
  request_timeout: 10s
  retry:
    initial_delay: 1s
    max_delay: 5m
    max_attempts: 10
  sinks: []

# Development-only example:
#  sinks:
#    - name: development
#      type: stdout
#
# Webhook example:
#  sinks:
#    - name: orders_webhook
#      type: webhook
#      url: https://events.example.com/writerelay
#      authorization_env: WRITERELAY_WEBHOOK_AUTHORIZATION
#      signing_secret_env: WRITERELAY_WEBHOOK_SIGNING_SECRET

logging:
  level: info
  format: text
