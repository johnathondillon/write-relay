version: 2
updates:
  - package-ecosystem: npm
    directory: /examples/nuxt-lms
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuxt-example:
        patterns:
          - '*'

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
